<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대장님의 실시간 여행 기록소</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Leaflet OpenStreetMap CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .tab-btn.active { color: #2563eb; border-bottom: 2px solid #2563eb; font-weight: 700; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #map { width: 100%; height: 380px; border-radius: 1.5rem; z-index: 1; }
        .custom-map-marker {
            background-color: #2563eb;
            color: white;
            font-weight: 800;
            font-size: 11px;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-panel px-5 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-blue-500/30">
                <i class="fa-solid fa-compass"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight leading-none text-slate-900">대장님의 여행 기록소</h1>
                <div class="flex items-center space-x-1.5 mt-1">
                    <span id="syncStatus" class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <p class="text-xs text-slate-500">Firebase 실시간 연동 완료</p>
                </div>
            </div>
        </div>
        <button onclick="openModal('addTripModal')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3.5 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/20 flex items-center space-x-1.5">
            <i class="fa-solid fa-plus"></i>
            <span>새 여행 추가</span>
        </button>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-6 space-y-6">

        <!-- Banner / Stats Summary -->
        <section class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs font-medium bg-blue-500/20 text-blue-300 border border-blue-500/30 px-3 py-1 rounded-full backdrop-blur-md">
                    👑 대장님 & 동행인 전용 클라우드
                </span>
                <span id="tripCounter" class="text-xs text-slate-400">동기화 중...</span>
            </div>
            <h2 class="text-xl font-bold leading-snug">모두가 함께 실시간으로 적는<br>나만의 시그니처 트래블 플랫폼</h2>
            
            <div class="grid grid-cols-3 gap-3 mt-6 pt-4 border-t border-slate-700/60 text-center">
                <div>
                    <p class="text-xs text-slate-400">방문 도시</p>
                    <p id="statCities" class="text-lg font-bold text-white mt-0.5">-</p>
                </div>
                <div>
                    <p class="text-xs text-slate-400">저장된 장소</p>
                    <p id="statPlaces" class="text-lg font-bold text-blue-400 mt-0.5">-</p>
                </div>
                <div>
                    <p class="text-xs text-slate-400">실시간 연동</p>
                    <p class="text-lg font-bold text-emerald-400 mt-0.5"><i class="fa-solid fa-cloud"></i> ON</p>
                </div>
            </div>
        </section>

        <!-- Trip Selector & Filter -->
        <section class="flex items-center space-x-2 overflow-x-auto hide-scrollbar py-1" id="tripTabs">
            <!-- Dynamic Tabs -->
        </section>

        <!-- Main Content Area -->
        <div id="mainTripContainer">
            <!-- Dynamic Content -->
        </div>

    </main>

    <!-- Modal: Add New Trip -->
    <div id="addTripModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900">새 여행 프로젝트 생성</h3>
                <button onclick="closeModal('addTripModal')" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="newTripForm" onsubmit="handleCreateTrip(event)" class="space-y-3.5 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">여행 제목</label>
                    <input type="text" id="tripTitle" required placeholder="예: 2026 다롄 3박 4일 식도락 여행" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">도시 / 국가</label>
                        <input type="text" id="tripCity" required placeholder="예: 중국 대련" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">여행 기간</label>
                        <input type="text" id="tripDates" required placeholder="예: 11.13 - 11.16" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">숙소 (Hotel)</label>
                    <input type="text" id="tripHotel" placeholder="예: Novotel Dalian Zhongshan Square" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">숙소 주소 (중국어/영문)</label>
                    <input type="text" id="tripHotelAddress" placeholder="예: 中山区 玉光街 7号" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">가는 비행기</label>
                        <input type="text" id="flightOut" placeholder="예: OZ301 (09:35)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">오는 비행기</label>
                        <input type="text" id="flightIn" placeholder="예: OZ302 (11:00)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all mt-2">
                    클라우드에 저장 및 공유하기
                </button>
            </form>
        </div>
    </div>

    <!-- Modal: Add / Edit Schedule Item -->
    <div id="addItemModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <h3 id="itemModalTitle" class="text-base font-bold text-slate-900">일정 / 장소 추가</h3>
                <button onclick="closeModal('addItemModal')" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="newItemForm" onsubmit="handleSaveItem(event)" class="space-y-3.5 text-sm">
                <input type="hidden" id="editingItemId" value="">
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">일차</label>
                        <select id="itemDay" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="1">1일차</option>
                            <option value="2">2일차</option>
                            <option value="3">3일차</option>
                            <option value="4">4일차</option>
                            <option value="0">미정 / 스크랩</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">시간</label>
                        <input type="text" id="itemTime" placeholder="14:00" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">카테고리</label>
                        <select id="itemCategory" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="맛집">맛집</option>
                            <option value="카페">카페</option>
                            <option value="마사지">마사지</option>
                            <option value="관광">관광</option>
                            <option value="쇼핑">쇼핑</option>
                            <option value="이동">이동</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">장소 / 제목</label>
                    <input type="text" id="itemTitle" required placeholder="예: 밍지카오위 (농어 카오위 맛집)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">📍 주소 한줄</label>
                    <input type="text" id="itemAddress" placeholder="예: 沙河口区 西安路 Roosevelt Center 4F" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">💡 메모 한줄</label>
                    <input type="text" id="itemNote" placeholder="예: 농어 마라맛 필수 주문 / 대기시간 약 20분" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">

                    <button type="button" id="deleteItemBtn" onclick="handleDeleteItem()" class="hidden w-1/3 bg-rose-50 text-rose-600 font-semibold py-3 rounded-xl hover:bg-rose-100 transition-all text-xs">
                        삭제하기
                    </button>
                    <button type="submit" id="saveItemBtn" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all text-xs">
                        실시간 저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Edit Checklist Item -->
    <div id="editChecklistModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900">준비물 항목 수정/삭제</h3>
                <button onclick="closeModal('editChecklistModal')" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form onsubmit="handleSaveChecklist(event)" class="space-y-3.5 text-sm">
                <input type="hidden" id="editingChecklistId" value="">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">준비물 내용</label>
                    <input type="text" id="checklistText" required class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex space-x-2 pt-2">
                    <button type="button" onclick="handleDeleteChecklist()" class="w-1/3 bg-rose-50 text-rose-600 font-semibold py-3 rounded-xl hover:bg-rose-100 transition-all text-xs">
                        삭제하기
                    </button>
                    <button type="submit" class="w-2/3 bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all text-xs">
                        수정 저장하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Hotel Info & Copy -->
    <div id="hotelModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 text-center">
            <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-hotel"></i>
            </div>
            <div>
                <h3 id="hotelModalName" class="text-base font-bold text-slate-900"></h3>
                <p id="hotelModalAddress" class="text-xs text-slate-600 bg-slate-50 p-3 rounded-xl mt-2 font-mono border border-slate-100 leading-relaxed"></p>
            </div>
            <div class="flex space-x-2">
                <button onclick="copyHotelAddress()" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all text-xs flex items-center justify-center space-x-1.5">
                    <i class="fa-solid fa-copy"></i>
                    <span>주소 복사하기</span>
                </button>

            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900">✈️ 왕복 항공편 정보</h3>

            <div class="space-y-3 text-xs">

                    <p id="flightOutDetail" class="text-sm font-extrabold text-slate-900 mt-1"></p>
                </div>
                <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100">

                    <p id="flightInDetail" class="text-sm font-extrabold text-slate-900 mt-1"></p>
                </div>
            </div>
        </div>
    </div>

        function getCoordsForItem(item) {
            const str = (item.title + " " + item.address).toLowerCase();
            for (let key in locationCoords) {
                if (str.includes(key)) return locationCoords[key];
            }
            // 기본값 (대련 중심 좌표에서 미세 오프셋)
            return [38.9140 + (Math.random() * 0.02 - 0.01), 121.6150 + (Math.random() * 0.02 - 0.01)];
        }

        function calculateDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371; // 지구 반지름 (km)
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(1);
        }

        db.collection("trips").onSnapshot((snapshot) => {
            const fetchedTrips = [];
            snapshot.forEach(doc => fetchedTrips.push(doc.data()));
            
            if (fetchedTrips.length === 0) {
                db.collection("trips").doc(defaultSeedTrip.id).set(defaultSeedTrip);
                trips = [defaultSeedTrip];
            } else {
                trips = fetchedTrips;
            }

            if (!activeTripId && trips.length > 0) activeTripId = trips[0].id;
            render();
        }, (error) => {
            console.error("Firebase Sync Error:", error);
            if(trips.length === 0) trips = [defaultSeedTrip];
            render();
        });

        async function syncTripToCloud(trip) {
            try {
                await db.collection("trips").doc(trip.id).set(trip);
            } catch (err) {
                console.error("Cloud Save Failed:", err);
            }
        }

        window.handleSaveItem = async (e) => {

            if (!trip.items) trip.items = [];

            if (editId) {

                if (item) {

                    item.category = document.getElementById('itemCategory').value;

                    item.address = document.getElementById('itemAddress').value || '';
                    item.note = document.getElementById('itemNote').value || '';

            } else {
                const newItem = {
                    id: Date.now(),
                    day: parseInt(document.getElementById('itemDay').value),
                    time: document.getElementById('itemTime').value || '시간 미정',
                    title: document.getElementById('itemTitle').value,

            document.getElementById('newItemForm').reset();
            render();

        function initLeafletMap(items) {
            setTimeout(() => {
                const mapDiv = document.getElementById('map');
                if (!mapDiv) return;

                if (mapInstance) {
                    mapInstance.remove();
                    mapInstance = null;
                }

                // 대련 중심 좌표
                const defaultCenter = [38.9140, 121.6150];
                mapInstance = L.map('map').setView(defaultCenter, 12);

                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap'
                }).addTo(mapInstance);

                const latLngs = [];
                mapMarkers = [];

                items.forEach((item, index) => {
                    const coords = getCoordsForItem(item);
                    latLngs.push(coords);

                    const customIcon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div class="custom-map-marker">${index + 1}</div>`,
                        iconSize: [24, 24],
                        iconAnchor: [12, 12]
                    });

                    const marker = L.marker(coords, { icon: customIcon }).addTo(mapInstance);
                    marker.bindPopup(`
                        <div style="font-size: 12px; font-family: Pretendard;">
                            <span style="font-weight: 800; color: #2563eb;">${item.category}</span>
                            <strong style="display: block; font-size: 13px; margin-top: 2px;">${item.title}</strong>
                            <p style="margin: 4px 0 0 0; color: #64748b;">${item.address || ''}</p>
                            ${item.note ? `<p style="margin: 2px 0 0 0; color: #059669;">💡 ${item.note}</p>` : ''}
                        </div>
                    `);
                    mapMarkers.push(marker);
                });

                if (latLngs.length > 1) {
                    mapPolyline = L.polyline(latLngs, { color: '#2563eb', weight: 4, dashArray: '6, 6' }).addTo(mapInstance);
                    mapInstance.fitBounds(mapPolyline.getBounds(), { padding: [40, 40] });
                } else if (latLngs.length === 1) {
                    mapInstance.setView(latLngs[0], 13);
                }
            }, 100);
        }
