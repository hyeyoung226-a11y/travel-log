<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대장님의 실시간 여행 기록소</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #0f172a; }
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(226, 232, 240, 0.8); }
        .tab-btn.active { color: #2563eb; border-bottom: 2px solid #2563eb; font-weight: 700; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass-panel px-5 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-2xl bg-blue-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-blue-500/30">
                <i class="fa-solid fa-compass"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold tracking-tight leading-none text-slate-900">대장님의 여행 기록소</h1>
                <div class="flex items-center space-x-1.5 mt-1">
                    <span id="syncStatus" class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <p class="text-xs text-slate-500">Firebase 실시간 연동 완료</p>
                </div>
            </div>
        </div>
        <button onclick="openModal('addTripModal')" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3.5 py-2.5 rounded-xl transition-all shadow-md shadow-blue-500/20 flex items-center space-x-1.5">
            <i class="fa-solid fa-plus"></i>
            <span>새 여행 추가</span>
        </button>
    </header>

    <main class="max-w-3xl mx-auto px-4 mt-6 space-y-6">

        <!-- Banner / Stats Summary -->
        <section class="bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-950 text-white rounded-3xl p-6 shadow-xl relative overflow-hidden">
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="flex items-center justify-between mb-4">
                <span class="text-xs font-medium bg-blue-500/20 text-blue-300 border border-blue-500/30 px-3 py-1 rounded-full backdrop-blur-md">
                    👑 대장님 & 동행인 전용 클라우드
                </span>
                <span id="tripCounter" class="text-xs text-slate-400">동기화 중...</span>
            </div>
            <h2 class="text-xl font-bold leading-snug">모두가 함께 실시간으로 적는<br>나만의 시그니처 트래블 플랫폼</h2>
            
            <div class="grid grid-cols-3 gap-3 mt-6 pt-4 border-t border-slate-700/60 text-center">
                <div>
                    <p class="text-xs text-slate-400">방문 도시</p>
                    <p id="statCities" class="text-lg font-bold text-white mt-0.5">-</p>
                </div>
                <div>
                    <p class="text-xs text-slate-400">저장된 장소</p>
                    <p id="statPlaces" class="text-lg font-bold text-blue-400 mt-0.5">-</p>
                </div>
                <div>
                    <p class="text-xs text-slate-400">실시간 연동</p>
                    <p class="text-lg font-bold text-emerald-400 mt-0.5"><i class="fa-solid fa-cloud"></i> ON</p>
                </div>
            </div>
        </section>

        <!-- Trip Selector & Filter -->
        <section class="flex items-center space-x-2 overflow-x-auto hide-scrollbar py-1" id="tripTabs">
            <!-- Dynamic Tabs -->
        </section>

        <!-- Main Content Area -->
        <div id="mainTripContainer">
            <!-- Dynamic Content -->
        </div>

    </main>

    <!-- Modal: Add New Trip -->
    <div id="addTripModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900">새 여행 프로젝트 생성</h3>
                <button onclick="closeModal('addTripModal')" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="newTripForm" onsubmit="handleCreateTrip(event)" class="space-y-3.5 text-sm">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">여행 제목</label>
                    <input type="text" id="tripTitle" required placeholder="예: 2026 다롄 3박 4일 식도락 여행" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">도시 / 국가</label>
                        <input type="text" id="tripCity" required placeholder="예: 중국 대련" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">여행 기간</label>
                        <input type="text" id="tripDates" required placeholder="예: 11.13 - 11.16" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">숙소 (Hotel)</label>
                    <input type="text" id="tripHotel" placeholder="예: Novotel Dalian Zhongshan Square" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">가는 비행기</label>
                        <input type="text" id="flightOut" placeholder="예: OZ301 (09:35)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">오는 비행기</label>
                        <input type="text" id="flightIn" placeholder="예: OZ302 (11:00)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all mt-2">
                    클라우드에 저장 및 공유하기
                </button>
            </form>
        </div>
    </div>

    <!-- Modal: Add Schedule Item -->
    <div id="addItemModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden transition-opacity">
        <div class="bg-white w-full sm:max-w-md rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-2 border-b border-slate-100">
                <h3 class="text-base font-bold text-slate-900">일정 / 장소 추가</h3>
                <button onclick="closeModal('addItemModal')" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="newItemForm" onsubmit="handleCreateItem(event)" class="space-y-3.5 text-sm">
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">일차</label>
                        <select id="itemDay" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="1">1일차</option>
                            <option value="2">2일차</option>
                            <option value="3">3일차</option>
                            <option value="4">4일차</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">시간</label>
                        <input type="text" id="itemTime" placeholder="14:00" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">카테고리</label>
                        <select id="itemCategory" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                            <option value="관광">관광</option>
                            <option value="맛집">맛집</option>
                            <option value="이동">이동</option>
                            <option value="쇼핑">쇼핑</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">장소 / 제목</label>
                    <input type="text" id="itemTitle" required placeholder="예: 동항 이탈리아 수성 야경 감상" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">📍 주소 한줄</label>
                    <input type="text" id="itemAddress" placeholder="예: 中山区 中山广场 1호 (고덕지도 명칭)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">💡 메모 한줄</label>
                    <input type="text" id="itemNote" placeholder="예: 음악 분수쇼 19:30 시작 / 예산 약 100위안" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-3 rounded-xl hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all mt-2">
                    실시간 추가하기
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK Compat Loaders -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAPgadPS4n65v7t_Xsg4kOzduW-54bs0-U",
            authDomain: "my-log-953f5.firebaseapp.com",
            projectId: "my-log-953f5",
            storageBucket: "my-log-953f5.firebasestorage.app",
            messagingSenderId: "556942155615",
            appId: "1:556942155615:web:50b258965240f4d2a7e0ea",
            measurementId: "G-XWMM09791L"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let trips = [];
        let activeTripId = '';
        let currentTab = 'timeline';

        const defaultSeedTrip = {
            id: 'dalian-2026',
            title: '대련 3박 4일 여행',
            city: '중국 대련',
            dates: '11.13 - 11.16',
            hotel: 'Novotel Dalian Zhongshan Square',
            flightOut: 'OZ301 (09:35 출발)',
            flightIn: 'OZ302 (11:00 출발)',
            memoText: '• 택시 탈 때 고덕지도 화면 보여주기\n• 백화점 상권 시안루(西安路) 추천 맛집 체크\n• 비상금 및 현금 별도 보관',
            checklists: [
                { id: 1, text: '여권 & 중국 비자 확인', done: true },
                { id: 2, text: '트래블로그 / 현금 환전', done: true },
                { id: 3, text: 'eSIM 등록 및 활성화', done: false },
                { id: 4, text: '돼지코 변환 플러그 챙기기', done: false }
            ],
            items: [
                { id: 101, day: 1, time: '09:35', title: '인천공항 출발 (OZ301)', category: '이동', address: '인천 중구 공항로 272', note: '시차 -1시간 반영 / 약 1시간 25분 소요' },
                { id: 102, day: 1, time: '11:30', title: '노보텔 체크인 & 짐 보관', category: '이동', address: '中山区 玉光街 7号', note: '중산광장 도보 3분 거리' },
                { id: 103, day: 1, time: '13:30', title: '러시아 거리 탐방', category: '관광', address: '中山区 胜利桥北', note: '유럽풍 건축물 산책 및 사진 촬영' },
                { id: 104, day: 1, time: '17:00', title: '동항 이탈리아 수성 & 음악분수', category: '관광', address: '中山区 港浦路', note: '운하 야경 감상 / 분수쇼 시간 확인' },
                { id: 105, day: 2, time: '09:00', title: '연화산 전망대 모노레일', category: '관광', address: '西岗区 滨海西路', note: '다롄 전경 및 서해안 해변 감상' },
                { id: 106, day: 2, time: '14:00', title: '성해광장 (大连星海广场)', category: '관광', address: '沙河口区 星海广场', note: '동양 최대 규모 광장 / 바다 산책' },
                { id: 107, day: 2, time: '18:00', title: '밍지카오위 (카오위 맛집)', category: '맛집', address: '沙河口区 西安路 Roosevelt Center 4F', note: '농어(海鲈鱼) 마라 맛 추천' },
                { id: 108, day: 3, time: '10:00', title: '동관지에 근대 거리 산책', category: '관광', address: '西岗区 东关街', note: '레트로 분위기 핫플레이스' },
                { id: 109, day: 3, time: '18:30', title: '시안루 야시장 투어', category: '맛집', address: '沙河口区 长兴街', note: '길거리 야식 및 꿔바로우 맛보기' }
            ]
        };

        db.collection("trips").onSnapshot((snapshot) => {
            const fetchedTrips = [];
            snapshot.forEach(doc => fetchedTrips.push(doc.data()));
            
            if (fetchedTrips.length === 0) {
                db.collection("trips").doc(defaultSeedTrip.id).set(defaultSeedTrip);
                trips = [defaultSeedTrip];
            } else {
                trips = fetchedTrips;
            }

            if (!activeTripId && trips.length > 0) activeTripId = trips[0].id;
            render();
        }, (error) => {
            console.error("Firebase Sync Error:", error);
            render();
        });

        async function syncTripToCloud(trip) {
            await db.collection("trips").doc(trip.id).set(trip);
        }

        window.openModal = (id) => document.getElementById(id).classList.remove('hidden');
        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        window.setActiveTrip = (id) => {
            activeTripId = id;
            render();
        };

        window.setSubTab = (tab) => {
            currentTab = tab;
            render();
        };

        window.handleCreateTrip = async (e) => {
            e.preventDefault();
            const newTrip = {
                id: 'trip-' + Date.now(),
                title: document.getElementById('tripTitle').value,
                city: document.getElementById('tripCity').value,
                dates: document.getElementById('tripDates').value,
                hotel: document.getElementById('tripHotel').value || '숙소 미정',
                flightOut: document.getElementById('flightOut').value || '미정',
                flightIn: document.getElementById('flightIn').value || '미정',
                memoText: '',
                checklists: [
                    { id: Date.now()+1, text: '여권 챙기기', done: false },
                    { id: Date.now()+2, text: '환전 / 결제 카드 챙기기', done: false }
                ],
                items: []
            };

            trips.unshift(newTrip);
            activeTripId = newTrip.id;
            closeModal('addTripModal');
            document.getElementById('newTripForm').reset();
            await syncTripToCloud(newTrip);
        };

        window.handleCreateItem = async (e) => {
            e.preventDefault();
            const trip = trips.find(t => t.id === activeTripId);
            if (!trip) return;

            const newItem = {
                id: Date.now(),
                day: parseInt(document.getElementById('itemDay').value),
                time: document.getElementById('itemTime').value || '시간 미정',
                title: document.getElementById('itemTitle').value,
                category: document.getElementById('itemCategory').value,
                address: document.getElementById('itemAddress').value || '',
                note: document.getElementById('itemNote').value || ''
            };

            if(!trip.items) trip.items = [];
            trip.items.push(newItem);
            trip.items.sort((a,b) => a.day - b.day || a.time.localeCompare(b.time));
            closeModal('addItemModal');
            document.getElementById('newItemForm').reset();
            await syncTripToCloud(trip);
        };

        window.saveTripMemo = async () => {
            const trip = trips.find(t => t.id === activeTripId);
            if (!trip) return;
            const text = document.getElementById('tripMemoInput').value;
            trip.memoText = text;
            await syncTripToCloud(trip);
            alert('클라우드에 메모가 저장되었습니다!');
        };

        window.toggleChecklist = async (checkId) => {
            const trip = trips.find(t => t.id === activeTripId);
            if (!trip) return;
            const check = (trip.checklists || []).find(c => c.id === checkId);
            if (check) check.done = !check.done;
            await syncTripToCloud(trip);
        };

        window.addChecklistItem = async (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                const trip = trips.find(t => t.id === activeTripId);
                if (!trip) return;
                if(!trip.checklists) trip.checklists = [];
                trip.checklists.push({ id: Date.now(), text: e.target.value.trim(), done: false });
                e.target.value = '';
                await syncTripToCloud(trip);
            }
        };

        window.deleteItem = async (itemId) => {
            const trip = trips.find(t => t.id === activeTripId);
            if (!trip) return;
            trip.items = (trip.items || []).filter(i => i.id !== itemId);
            await syncTripToCloud(trip);
        };

        function renderStats() {
            document.getElementById('tripCounter').innerText = `총 ${trips.length}개의 여정`;
            const cities = new Set(trips.map(t => t.city)).size;
            const totalPlaces = trips.reduce((acc, t) => acc + (t.items ? t.items.length : 0), 0);
            document.getElementById('statCities').innerText = cities;
            document.getElementById('statPlaces').innerText = totalPlaces;
        }

        function renderTabs() {
            const container = document.getElementById('tripTabs');
            container.innerHTML = trips.map(t => `
                <button onclick="setActiveTrip('${t.id}')" class="px-4 py-2 rounded-2xl text-xs font-semibold whitespace-nowrap transition-all ${t.id === activeTripId ? 'bg-blue-600 text-white shadow-md shadow-blue-500/20' : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'}">
                    📍 ${t.title}
                </button>
            `).join('');
        }

        function renderMainContent() {
            const container = document.getElementById('mainTripContainer');
            const trip = trips.find(t => t.id === activeTripId);

            if (!trip) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm">등록된 여행 프로젝트가 없습니다.</div>`;
                return;
            }

            container.innerHTML = `
                <!-- Trip Summary Info Card -->
                <div class="bg-white rounded-3xl p-5 shadow-sm border border-slate-200/80 mb-6 space-y-3">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs font-bold text-blue-600 uppercase tracking-wider">${trip.city}</span>
                            <h3 class="text-lg font-extrabold text-slate-900 mt-0.5">${trip.title}</h3>
                        </div>
                        <span class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-lg font-medium">${trip.dates}</span>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-2 text-xs pt-2 border-t border-slate-100 text-slate-600">
                        <div class="flex items-center space-x-2 bg-slate-50 p-2.5 rounded-xl">
                            <i class="fa-solid fa-hotel text-blue-500"></i>
                            <span class="truncate">${trip.hotel}</span>
                        </div>
                        <div class="flex items-center space-x-2 bg-slate-50 p-2.5 rounded-xl">
                            <i class="fa-solid fa-plane text-indigo-500"></i>
                            <span class="truncate">${trip.flightOut} / ${trip.flightIn}</span>
                        </div>
                    </div>

                    <!-- Sub Tab Switches -->
                    <div class="flex border-b border-slate-200 text-xs pt-2">
                        <button onclick="setSubTab('timeline')" class="tab-btn pb-2.5 px-4 ${currentTab === 'timeline' ? 'active' : 'text-slate-500'}">
                            <i class="fa-solid fa-timeline mr-1"></i> 타임라인 일정
                        </button>
                        <button onclick="setSubTab('checklist')" class="tab-btn pb-2.5 px-4 ${currentTab === 'checklist' ? 'active' : 'text-slate-500'}">
                            <i class="fa-solid fa-list-check mr-1"></i> 체크리스트 (${(trip.checklists||[]).filter(c=>c.done).length}/${(trip.checklists||[]).length})
                        </button>
                        <button onclick="setSubTab('memo')" class="tab-btn pb-2.5 px-4 ${currentTab === 'memo' ? 'active' : 'text-slate-500'}">
                            <i class="fa-solid fa-note-sticky mr-1"></i> 클라우드 메모장
                        </button>
                    </div>
                </div>

                <!-- Tab Content: Timeline -->
                ${currentTab === 'timeline' ? `
                    <div class="space-y-4">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Day-by-Day Itinerary</h4>
                            <button onclick="openModal('addItemModal')" class="text-xs font-semibold text-blue-600 hover:underline flex items-center space-x-1">
                                <i class="fa-solid fa-plus"></i><span>일정 추가</span>
                            </button>
                        </div>
                        
                        ${[1,2,3,4].map(day => {
                            const dayItems = (trip.items || []).filter(i => i.day === day);
                            if (dayItems.length === 0 && day > 2) return '';
                            return `
                                <div class="bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm space-y-3">
                                    <div class="flex items-center justify-between pb-2 border-b border-slate-100">
                                        <span class="text-xs font-black text-slate-800 bg-blue-50 text-blue-700 px-2.5 py-1 rounded-lg">Day ${day}</span>
                                        <span class="text-xs text-slate-400">${dayItems.length}개의 일정</span>
                                    </div>
                                    <div class="space-y-3">
                                        ${dayItems.length ? dayItems.map(item => `
                                            <div class="flex items-start justify-between group p-3 rounded-xl bg-slate-50/50 hover:bg-slate-100/80 border border-slate-100 transition-colors">
                                                <div class="flex items-start space-x-3 w-full">
                                                    <span class="text-xs font-bold text-slate-400 mt-0.5 w-10 shrink-0">${item.time}</span>
                                                    <div class="space-y-1 w-full">
                                                        <div class="flex items-center space-x-2">
                                                            <span class="text-sm font-bold text-slate-900">${item.title}</span>
                                                            <span class="text-[10px] px-2 py-0.5 rounded-md font-medium ${item.category === '맛집' ? 'bg-amber-100 text-amber-700' : item.category === '이동' ? 'bg-indigo-100 text-indigo-700' : 'bg-emerald-100 text-emerald-700'}">${item.category}</span>
                                                        </div>
                                                        ${item.address ? `
                                                            <div class="flex items-center space-x-1.5 text-xs text-slate-600 bg-white px-2 py-1 rounded-lg border border-slate-200/60 w-fit">
                                                                <i class="fa-solid fa-location-dot text-rose-500 text-[11px]"></i>
                                                                <span>${item.address}</span>
                                                            </div>
                                                        ` : ''}
                                                        ${item.note ? `
                                                            <div class="flex items-center space-x-1.5 text-xs text-slate-500 pt-0.5">
                                                                <i class="fa-regular fa-comment-dots text-blue-500 text-[11px]"></i>
                                                                <span>${item.note}</span>
                                                            </div>
                                                        ` : ''}
                                                    </div>
                                                </div>
                                                <button onclick="deleteItem(${item.id})" class="text-slate-300 hover:text-rose-500 opacity-0 group-hover:opacity-100 transition-opacity p-1 ml-2">
                                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                                </button>
                                            </div>
                                        `).join('') : '<p class="text-xs text-slate-400 text-center py-2">등록된 일정이 없습니다.</p>'}
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                ` : currentTab === 'checklist' ? `
                    <!-- Tab Content: Checklist -->
                    <div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-sm space-y-4">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">준비물 & 체크리스트</h4>
                        </div>
                        
                        <div class="space-y-2">
                            ${(trip.checklists || []).map(check => `
                                <div onclick="toggleChecklist(${check.id})" class="flex items-center justify-between p-3 rounded-2xl border ${check.done ? 'bg-slate-50 border-slate-200 text-slate-400 line-through' : 'bg-white border-slate-200/80 text-slate-800'} cursor-pointer hover:border-blue-300 transition-all">
                                    <div class="flex items-center space-x-3 text-sm font-medium">
                                        <div class="w-5 h-5 rounded-md border ${check.done ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-300'} flex items-center justify-center text-xs">
                                            ${check.done ? '<i class="fa-solid fa-check"></i>' : ''}
                                        </div>
                                        <span>${check.text}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>

                        <div class="pt-2">
                            <input type="text" onkeydown="addChecklistItem(event)" placeholder="+ 준비물 항목 추가 후 Enter" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                    </div>
                ` : `
                    <!-- Tab Content: Cloud Memo -->
                    <div class="bg-white rounded-3xl p-5 border border-slate-200/80 shadow-sm space-y-4">
                        <div class="flex justify-between items-center">
                            <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider">실시간 공유 메모장</h4>
                            <span class="text-[10px] text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md font-medium">자동 동기화 지원</span>
                        </div>
                        
                        <p class="text-xs text-slate-500">여행 관련 꿀팁, 택시 기사님께 보여줄 중국어 주소, 공유할 정보 등을 자유롭게 적어두세요.</p>

                        <textarea id="tripMemoInput" rows="8" placeholder="예: 택시 탈 때 '请带 me 去...' 라고 말하기" class="w-full p-4 text-sm rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 leading-relaxed font-mono text-slate-800">${trip.memoText || ''}</textarea>

                        <button onclick="saveTripMemo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl shadow-md shadow-blue-500/20 transition-all text-xs flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-floppy-disk"></i>
                            <span>메모 클라우드에 저장하기</span>
                        </button>
                    </div>
                `}
            `;
        }

        function render() {
            renderStats();
            renderTabs();
            renderMainContent();
        }
    </script>
</body>
</html>
